<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple NAS — sign in</title>
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1e26;
    --panel-2: #20252f;
    --border: #2c323d;
    --text: #e6e8eb;
    --text-dim: #8b93a1;
    --accent: #4f9dde;
    --danger: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 26px;
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  p.sub { margin: 0 0 14px; color: var(--text-dim); font-size: 12px; }
  label { font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 3px; }
  input[type=text], input[type=password] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 9px;
    font-size: 13px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    margin-top: 8px;
    background: var(--accent);
    border: none;
    color: #0d1a24;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  #error {
    display: none;
    background: #2a1a1a;
    border: 1px solid #4a2c2c;
    color: var(--danger);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>
<form method="POST" action="/login">
  <h1>Simple NAS</h1>
  <p class="sub">Sign in to manage your server</p>
  <div id="error"></div>
  <div>
    <label for="u">Username</label>
    <input type="text" id="u" name="username" required autocomplete="username">
  </div>
  <div>
    <label for="p">Password</label>
    <input type="password" id="p" name="password" required autocomplete="current-password">
  </div>
  <button type="submit">Sign in</button>
</form>
<script>
  const params = new URLSearchParams(window.location.search);
  const errorCode = params.get('error');
  const messages = {
    invalid: 'Invalid username or password.',
    locked: 'Too many failed attempts. Please try again in a few minutes.'
  };
  if (errorCode && messages[errorCode]) {
    const box = document.getElementById('error');
    box.textContent = messages[errorCode];
    box.style.display = 'block';
  }
</script>
</body>
</html>
