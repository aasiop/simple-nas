[global]
    workgroup = WORKGROUP
    security = user

    server string = home-nas
    netbios name = home-nas

    map to guest = never

    server min protocol = SMB2

    load printers = no
    printing = bsd
    printcap name = /dev/null

    log level = 1



[Public]
    path = /share/Public
        
    browseable = yes
    guest ok = no
                
    read only = no
    write list = alice
                
    valid users = alice
        
    force user = smbuser
    force group = smb
    create mask = 0660
    directory mask = 0770