<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple NAS — panel</title>
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1e26;
    --panel-2: #20252f;
    --border: #2c323d;
    --text: #e6e8eb;
    --text-dim: #8b93a1;
    --accent: #4f9dde;
    --danger: #d9534f;
    --danger-dim: #4a2321;
    --ok: #4caf7d;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 24px 80px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  header p { margin: 0; color: var(--text-dim); font-size: 13px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  section.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 18px 20px;
  }
  section.card h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  section.card h2 .count {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 20px;
  }
  .item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .item .main { min-width: 0; }
  .item .name { font-weight: 600; font-family: var(--mono); font-size: 13px; }
  .item .meta { color: var(--text-dim); font-size: 12px; margin-top: 3px; line-height: 1.5; word-break: break-word; }
  .item .meta code { font-family: var(--mono); color: #b9c2cf; }
  .item .tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .tag.on { color: var(--ok); border-color: #2c4a3a; }
  .tag.off { color: var(--danger); border-color: #4a2c2c; }
  .actions { display: flex; flex-direction: row; gap: 6px; align-items: center; flex-shrink: 0; }
  button.del, button.eye {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button.del { color: var(--danger); }
  button.del:hover { background: var(--danger-dim); border-color: var(--danger); }
  button.eye { color: var(--text-dim); }
  button.eye:hover { background: var(--panel); border-color: var(--accent); color: var(--accent); }
  .empty { color: var(--text-dim); font-size: 13px; padding: 14px 4px; text-align: center; }

  form.add {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  form.add .row { display: flex; gap: 8px; }
  form.add label {
    font-size: 11px;
    color: var(--text-dim);
    display: block;
    margin-bottom: 3px;
  }
  form.add .field { flex: 1; min-width: 100px; }
  input[type=text], input[type=password] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 13px;
    font-family: var(--mono);
  }
  input:focus { outline: none; border-color: var(--accent); }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; margin: 4px 0 2px; }
  .checks label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
  }
  button.submit {
    margin-top: 4px;
    background: var(--accent);
    border: none;
    color: #0d1a24;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  button.submit:hover { filter: brightness(1.08); }
  button.submit:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Simple NAS - control panel</h1>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Users <span class="count" id="users-count">0</span></h2>
      <div id="users-list"></div>
      <form class="add" id="user-form">
        <div class="row">
          <div class="field">
            <label for="u-name">Username</label>
            <input type="text" id="u-name" required placeholder="e.g. alice">
          </div>
          <div class="field">
            <label for="u-pass">Password</label>
            <input type="password" id="u-pass" required placeholder="password">
          </div>
        </div>
        <button type="submit" class="submit">+ Add user</button>
      </form>
    </section>

    <section class="card">
      <h2>Shares <span class="count" id="shares-count">0</span></h2>
      <div id="shares-list"></div>
      <form class="add" id="share-form">
        <div class="row">
          <div class="field">
            <label for="s-name">Share name</label>
            <input type="text" id="s-name" required placeholder="e.g. Public">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="s-path">Path</label>
            <input type="text" id="s-path" required placeholder="/share/public">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="s-valid">valid users</label>
            <input type="text" id="s-valid" placeholder="alice,bob">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="s-write">write list</label>
            <input type="text" id="s-write" placeholder="alice,bob">
          </div>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="s-browseable" checked> browseable</label>
          <label><input type="checkbox" id="s-guest"> guest ok</label>
          <label><input type="checkbox" id="s-readonly"> read only</label>
        </div>
        <button type="submit" class="submit">+ Add share</button>
      </form>
    </section>
  </div>

  <section class="card" style="margin-top: 20px;">
    <button id="apply-btn" class="submit" style="width: 100%;">Save changes (restart docker container)</button>
    <div id="apply-status" style="margin-top: 10px; font-size: 12px; color: var(--text-dim);"></div>
  </section>
</div>

<script>

let currentUsers = [];

let editingPasswords = new Set();

async function loadConfig() {
  const res = await fetch('/api/config');
  const data = await res.json();
  currentUsers = data.users;
  showUsers(currentUsers);
  showShares(data.shares);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

const PENCIL_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>';

function showUsers(users) {
  const list = document.getElementById('users-list');
  document.getElementById('users-count').textContent = users.length;

  if (users.length === 0) {
    list.innerHTML = '<div class="empty">Currently no users added</div>';
    return;
  }

  list.innerHTML = users.map(u => {
    const isEditing = editingPasswords.has(u.username);

    return `
      <div class="item">
        <div class="main">
          <div class="name">${escapeHtml(u.username)}</div>
          ${isEditing
            ? `<div class="meta"><input type="password" id="pw-${escapeHtml(u.username)}" placeholder="new password"></div>`
            : `<div class="meta">password: <code>••••••••</code></div>`}
        </div>
        <div class="actions">
          <button class="eye" onclick="togglePasswordEdit('${escapeHtml(u.username)}')">${PENCIL_ICON}</button>
          <button class="del" onclick="removeUser('${escapeHtml(u.username)}')">×</button>
        </div>
      </div>
    `;
  }).join('');
}

function showShares(shares) {
  const list = document.getElementById('shares-list');
  document.getElementById('shares-count').textContent = shares.length;

  if (shares.length === 0) {
    list.innerHTML = '<div class="empty">Currently no shares configured.</div>';
    return;
  }

  list.innerHTML = shares.map(s => `
    <div class="item">
      <div class="main">
        <div class="name">[${escapeHtml(s.name)}]</div>
        <div class="meta">
          path: <code>${escapeHtml(s.path)}</code><br>
          valid users: <code>${escapeHtml(s.validUsers.join(', ') || '—')}</code><br>
          write list: <code>${escapeHtml(s.writeList.join(', ') || '—')}</code>
        </div>
        <div class="tags">
          <span class="tag ${s.browseable ? 'on' : 'off'}">browseable: ${s.browseable ? 'yes' : 'no'}</span>
          <span class="tag ${s.guest ? 'on' : 'off'}">guest: ${s.guest ? 'yes' : 'no'}</span>
          <span class="tag ${s.readonly ? 'off' : 'on'}">read only: ${s.readonly ? 'yes' : 'no'}</span>
        </div>
      </div>
      <button class="del" onclick="removeShare('${escapeHtml(s.name)}')">×</button>
    </div>
  `).join('');
}

function togglePasswordEdit(username) {
  if (editingPasswords.has(username)) {
    const input = document.getElementById(`pw-${username}`);
    const newPassword = input ? input.value : '';
    editingPasswords.delete(username);
    if (newPassword) {
      sendEvent('user', 'reset', { username: username, password: newPassword });
      return;
    }
  } else {
    editingPasswords.add(username);
  }
  showUsers(currentUsers);
}

function getCsrfToken() {
  const match = document.cookie.match(/(?:^|; )csrf_token=([^;]*)/);
  return match ? match[1] : '';
}

async function sendEvent(entity, type, payload) {
  await fetch('/api/events', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': getCsrfToken() },
    body: JSON.stringify({ type: type, entity: entity, payload: payload })
  });
  location.reload();
}

function removeUser(username) {
  sendEvent('user', 'remove', { username: username });
}

function removeShare(name) {
  sendEvent('share', 'remove', { name: name });
}

document.getElementById('user-form').addEventListener('submit', function (event) {
  event.preventDefault();
  const username = document.getElementById('u-name').value;
  const password = document.getElementById('u-pass').value;
  sendEvent('user', 'add', { username: username, password: password });
});

document.getElementById('share-form').addEventListener('submit', function (event) {
  event.preventDefault();
  const validUsers = document.getElementById('s-valid').value.split(',').map(s => s.trim()).filter(Boolean);
  const writeList = document.getElementById('s-write').value.split(',').map(s => s.trim()).filter(Boolean);

  const share = {
    name: document.getElementById('s-name').value,
    path: document.getElementById('s-path').value,
    browseable: document.getElementById('s-browseable').checked,
    guest: document.getElementById('s-guest').checked,
    readonly: document.getElementById('s-readonly').checked,
    validUsers: validUsers,
    writeList: writeList
  };

  sendEvent('share', 'add', share);
});

loadConfig();

document.getElementById('apply-btn').addEventListener('click', async function () {
  const btn = this;
  const status = document.getElementById('apply-status');

  btn.disabled = true;
  status.textContent = 'Restarting container...';
  status.style.color = 'var(--text-dim)';

  try {
    const res = await fetch('/api/apply', {
      method: 'POST',
      headers: { 'X-CSRF-Token': getCsrfToken() }
    });
    const data = await res.json();

    if (data.ok) {
      status.textContent = 'Done - container is running with the new config.';
      status.style.color = 'var(--ok)';
    } else {
      status.textContent = 'Error: ' + (data.error || data.stderr || 'unknown error');
      status.style.color = 'var(--danger)';
    }
  } catch (err) {
    status.textContent = 'Could not reach the server.';
    status.style.color = 'var(--danger)';
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
